# Assembler configuration.
#
# The published site is built from several content roots. The first `reference`
# root owns the navigation and ships a complete `docs.json`, so it can also be
# served on its own with `mint dev` — that is how a contributor previews the
# open-source documentation without this repository at all. Every other root
# contributes a `docs.nav.json` fragment, whose tabs are merged by name.
#
# An `overlay` root replaces whole pages: each of its pages takes the place of
# the reference page at the same path. It adds no pages and no navigation, and
# its `docs.nav.json` may only carry redirects.

output: ${ASSEMBLE_OUTPUT:-build/site}

roots:
  # Open-source pages, and the navigation for the whole site. Override the path
  # with LANCEDB_DOCS_ROOT when the checkout is somewhere else; CI sets it.
  - name: lancedb
    path: ${LANCEDB_DOCS_ROOT:-../lancedb/docs/web}
    role: reference

  # Enterprise pages, from the private repository's public `docs/web` folder;
  # the rest of `sophon/docs` is internal and must never be read. Every path
  # here also exists in `lancedb`, which owns the navigation; an overlay page
  # replaces the reference page at the same path rather than adding one.
  # `private` refuses symlinks and hidden files under the root. Override the
  # path with SOPHON_DOCS_ROOT; CI sets it from its checkout.
  - name: enterprise
    path: ${SOPHON_DOCS_ROOT:-../sophon/docs/web}
    role: overlay
    private: true

  # What this repository still owns: the Geneva pages until Stage G replaces
  # them, the generated dataset cards, and the OpenAPI spec.
  - name: build
    path: docs
    role: reference

openapi:
  repo: lance-format/lance-namespace
  release: v0.12.0
  source: docs/src/spec.yaml
  dest: docs/api-reference/rest/openapi.yml
