# How scripts/compose.py composes the saved editions into the versioned site.
# See "Composing the site" in README.md.

# Links to this host in a saved page are pointed into the page's own edition.
host: docs.lancedb.com

# Products in selector order. Readers land on the first product's preferred
# edition, and unversioned URLs redirect to its matching pages.
products:
  - product: enterprise
    label: Enterprise
    name: LanceDB Enterprise
    description: Multimodal lakehouse
    icon: server
    # The reviewed edition readers get by default, labelled Latest.
    preferred: 1.10.1
  - product: oss
    label: OSS
    name: LanceDB OSS
    description: Embedded library
    icon: database
    preferred:
