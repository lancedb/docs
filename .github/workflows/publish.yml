name: Publish


on:
  workflow_dispatch:
    inputs:
      target:
        description: staging (hosted preview) or production
        type: choice
        options:
          - staging
          - production
        default: staging
      run_id:
        description: ID of the successful Assemble or Compose run whose candidate to publish
        required: true
      site_sha256:
        description: The candidate's site checksum, from that run's summary
        required: true
  # Only a wake-up: the staging job reads main itself, so an older or repeated
  # run cannot put an older candidate on staging.
  workflow_run:
    workflows:
      - Compose
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

env:
  MINTLIFY_CONTENT_DIR: ${{ vars.MINTLIFY_CONTENT_DIR }}

jobs:
  staging:
    name: Publish to staging
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # One group for both targets, so no Publish run changes staging while
    # production checks it and pushes. Each waits its turn; none is cancelled.
    concurrency:
      group: publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write # the `staging` branch; the `assembled` ruleset must refuse this token
      actions: read # the candidate artifact and its run
    steps:
      - uses: actions/checkout@v4

      # By hand, the run named. Automatically, the newest successful Compose
      # run of main's newest commit, if there is one yet.
      - name: Choose the run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            main=$(git ls-remote origin refs/heads/main | cut -f1)
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/compose.yml/runs"
            RUN_ID=$(gh api "$runs?branch=main&head_sha=$main&status=success" --jq \
              '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].id // empty')
          fi
          if ! [[ "$RUN_ID" =~ ^[0-9]*$ ]]; then
            echo "::error::run ID $RUN_ID is not a number"
            exit 1
          fi
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Fall back to verified publication history when the artifact has expired.
      - name: Download the candidate
        if: steps.run.outputs.id
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Read the run that recorded it
        if: steps.run.outputs.id
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.id }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"

      - name: Publish
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
          SITE_SHA256: ${{ inputs.site_sha256 }}
          AUTOMATIC: ${{ github.event_name == 'workflow_run' && 'true' || '' }}
        run: |
          python3 scripts/candidate.py publish --target staging ${AUTOMATIC:+--automatic} \
            --run-id "$RUN_ID" --site-sha256 "$SITE_SHA256" \
            --run "$RUNNER_TEMP/run.json" --repository "$GITHUB_REPOSITORY" \
            --content-dir "$MINTLIFY_CONTENT_DIR" --candidate "$RUNNER_TEMP/candidate" \
            --summary "$GITHUB_STEP_SUMMARY"

  # Runs before the approval: an approval given after production has changed
  # publishes nothing.
  request:
    name: Read production when requested
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      production: ${{ steps.read.outputs.production }}
    steps:
      - uses: actions/checkout@v4

      - name: Read production
        id: read
        run: |
          set -euo pipefail
          heads=$(git ls-remote origin refs/heads/assembled)
          echo "production=${heads%%[[:space:]]*}" >> "$GITHUB_OUTPUT"

  production:
    name: Publish to production
    needs: request
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    # Environment restrictions and branch rules must be enforced externally.
    environment: production
    # The staging job's group: staging, production and Mintlify's deployments
    # are read only once this job is in it.
    concurrency:
      group: publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # the candidate artifact and its run
      deployments: read # Mintlify's deployments of the staging commit
    steps:
      - name: Require main and the production key
        env:
          DEPLOY_KEY: ${{ secrets.ASSEMBLED_DEPLOY_KEY }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::production is published only by the workflow on main"
            exit 1
          fi
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::the production environment has no ASSEMBLED_DEPLOY_KEY"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.ASSEMBLED_DEPLOY_KEY }}

      - name: Download the candidate
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Read the run that recorded it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"

      # A push is not a deployment: Mintlify records each deployment of a commit,
      # and the address it went live at, as a GitHub deployment.
      - name: Read Mintlify's deployments of staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          staging=$(git ls-remote origin refs/heads/staging | cut -f1)
          if [ -n "$staging" ]; then
            api="repos/$GITHUB_REPOSITORY/deployments"
            ids=$(gh api "$api?sha=$staging&per_page=100" --jq '.[].id')
            for id in $ids; do
              gh api "$api/$id/statuses?per_page=100" > "$RUNNER_TEMP/statuses.json"
              gh api "$api/$id" | jq --slurpfile statuses "$RUNNER_TEMP/statuses.json" \
                '. + {statuses: $statuses[0]}'
            done | jq -s . > "$RUNNER_TEMP/staging-deployments.json"
          fi

      - name: Publish
        env:
          RUN_ID: ${{ inputs.run_id }}
          SITE_SHA256: ${{ inputs.site_sha256 }}
          PRODUCTION: ${{ needs.request.outputs.production }}
          STAGING_URL: ${{ vars.MINTLIFY_STAGING_URL }}
        run: |
          python3 scripts/candidate.py publish --target production \
            --run-id "$RUN_ID" --site-sha256 "$SITE_SHA256" \
            --run "$RUNNER_TEMP/run.json" --repository "$GITHUB_REPOSITORY" \
            --content-dir "$MINTLIFY_CONTENT_DIR" --candidate "$RUNNER_TEMP/candidate" \
            --staging-deployments "$RUNNER_TEMP/staging-deployments.json" \
            --staging-url "$STAGING_URL" \
            --production-was "$PRODUCTION" --summary "$GITHUB_STEP_SUMMARY"
