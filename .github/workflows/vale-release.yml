name: Release Vale package

on:
  push:
    branches: [main]
    paths:
      - "vale/LanceDB/meta.json"
      - ".github/workflows/vale-release.yml"
      - "scripts/vale_release.py"
  pull_request:
    paths:
      - "vale/**"
      - ".github/workflows/vale-release.yml"
      - "scripts/vale_release.py"
      - "scripts/tests/test_vale_release.py"
  workflow_dispatch:

# Publishing a style package does not publish the documentation site.
permissions:
  contents: read

concurrency:
  group: vale-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      VALE_VERSION: 3.24.0
      VALE_SHA256: 867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Vale
        run: |
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/$archive"
          echo "${VALE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test the package
        working-directory: vale/LanceDB
        run: vale test --coverage styles ../tests

      - name: Test release preparation
        run: python3 -B -m unittest discover -s scripts/tests -p test_vale_release.py -v

      - name: Build and verify the package without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/vale_release.py --output-dir "$RUNNER_TEMP/vale-release"

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Recheck in the publishing job in case the release appeared during validation.
      - name: Prepare the package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/vale_release.py --output-dir "$RUNNER_TEMP/vale-release"

      - name: Publish a new version
        if: steps.package.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/vale-release/LanceDB.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" --latest=false \
            --notes "Shared LanceDB Vale rules. Source commit: $GITHUB_SHA. This release does not publish the documentation site."
