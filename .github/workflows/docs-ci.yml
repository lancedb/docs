name: Docs Check

# The site is assembled from lancedb/lancedb, lancedb/sophon and this
# repository, so links are checked on the assembled tree. `docs/` alone is no
# longer a site: checking it reported pages that live in the other roots as
# missing. The Assemble workflow runs the same checks before it records a
# candidate; this job keeps the required status check about the site a merge
# would build.
#
# The REST API spec is tracked in-repo at the release pinned in `assemble.yaml`
# and checked with `make check-spec`.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  LANCEDB_DOCS_ROOT: lancedb/docs/web
  SOPHON_DOCS_ROOT: sophon/docs/web

jobs:
  broken-links-and-openapi:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the open-source documentation
        uses: actions/checkout@v4
        with:
          repository: lancedb/lancedb
          ref: main
          path: lancedb
          sparse-checkout: docs/web
          persist-credentials: false

      - name: Create a read-only Sophon token
        id: sophon-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOPHON_DOCS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOPHON_DOCS_APP_PRIVATE_KEY }}
          owner: lancedb
          repositories: sophon
          permission-contents: read

      - name: Check out the Enterprise documentation
        uses: actions/checkout@v4
        with:
          repository: lancedb/sophon
          ref: main
          path: sophon
          token: ${{ steps.sophon-token.outputs.token }}
          sparse-checkout: docs/web
          submodules: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Mintlify CLI
        run: npm install -g mint@4.2.888

      - name: Check the OpenAPI spec matches its release
        run: make check-spec

      - name: Assemble
        run: make assemble

      - name: Validate the assembled tree
        working-directory: build/site
        run: mint validate

      - name: Check links, anchors and redirects in the assembled tree
        working-directory: build/site
        run: mint broken-links --check-anchors --check-redirects
