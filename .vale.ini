# Lints this repository's pages with the working copy of the package in
# vale/LanceDB. Run `vale sync` from here first; see vale/README.md.
StylesPath = .vale/styles
Packages = vale/LanceDB

# Dataset pages are generated by `make hf-sync` from the upstream dataset
# cards. Fix their prose there or in scripts/sync_hf_datasets.py.
[docs/datasets/*.mdx]
BasedOnStyles = NONE
