[project]
name = "docs"
version = "0.1.0"
description = "LanceDB documentation assembly, dataset sync, and audit utilities"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "lancedb>=0.34.0",
    "pyarrow>=23.0.1",
    "pytest>=9.0.1",
    "pyyaml>=6.0",
]

[tool.uv]
# fury.io hosts beta geneva / pylance / lancedb releases. unsafe-best-match
# mimics pip so stable releases still fall back to PyPI.
index-strategy = "unsafe-best-match"
prerelease = "allow"

[[tool.uv.index]]
name = "lancedb"
url = "https://pypi.fury.io/lancedb/"

[[tool.uv.index]]
name = "lance-format"
url = "https://pypi.fury.io/lance-format/"
